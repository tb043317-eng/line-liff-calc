<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>當沖點位快速輸入</title>
  <!-- 1. 引入 LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #f4f4f9; margin: 0; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
    h2 { margin-top: 0; color: #333; text-align: center; }
    label { font-weight: bold; font-size: 14px; color: #555; }
    input { width: 100%; padding: 12px; margin: 8px 0 16px; border: 1px solid #ccc; border-radius: 8px; font-size: 18px; box-sizing: border-box; }
    button { width: 100%; padding: 14px; background: #06C755; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
    button:active { background: #05b04a; }
  </style>
</head>
<body>

<div class="card">
  <h2>⚡ 極短線當沖點位</h2>
  
  <label>最高點：</label>
  <input type="number" id="high" inputmode="numeric" placeholder="例如：46109">

  <label>最低點：</label>
  <input type="number" id="low" inputmode="numeric" placeholder="例如：45911">

  <label>當前價（選填）：</label>
  <input type="number" id="current" inputmode="numeric" placeholder="例如：46065">

  <button onclick="sendData()">⚡ 送出計算</button>
</div>

<script>
  // 1. 初始化 LIFF
  liff.init({ liffId: "2011098514-1xXU8Y1h" })
    .then(() => {
      // 如果還沒登入，強制進行 LINE 登入
      if (!liff.isLoggedIn()) {
        liff.login();
      }
    })
    .catch((err) => {
      console.error("LIFF 初始化失敗", err);
      alert("LIFF 初始化失敗，請重新開啟視窗");
    });

  // 2. 按下按鈕時的處理
  async function sendData() {
    if (!liff.isLoggedIn()) {
      alert("請先完成 LINE 登入授權！");
      liff.login();
      return;
    }

    const valHigh = parseFloat(document.getElementById('high').value);
    const valLow = parseFloat(document.getElementById('low').value);
    const valCurrent = parseFloat(document.getElementById('current').value);

    if (isNaN(valHigh) || isNaN(valLow)) {
      alert("請輸入最高點與最低點！");
      return;
    }

    // 自動比對確保 high 為較大值、low 為較小值
    const high = Math.max(valHigh, valLow);
    const low = Math.min(valHigh, valLow);

    // 組合訊息格式
    let msg = `${high} ${low}`;
    if (!isNaN(valCurrent)) msg += ` ${valCurrent}`;

    try {
      // 傳送訊息回聊天室
      await liff.sendMessages([{ type: 'text', text: msg }]);
      liff.closeWindow(); // 傳完自動關閉視窗
    } catch (err) {
      alert('發送失敗：' + err.message);
    }
  }
</script>

</body>
</html>
